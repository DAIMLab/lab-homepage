<!-- People, /team-daim. Paste into the page's Code editor, Body tab. The email
     property is plain text with no anchor, so this supplies the click: copy the
     address, then hold `.copied` for a moment, which css/team-daim.css renders
     as a check mark on the icon button. -->
<script>
  document.addEventListener('click', (e) => {
    const email = e.target.closest('.page__team-daim .notion-property__email');
    if (!email) return;
    const address = email.textContent.trim();
    if (!address) return;
    navigator.clipboard.writeText(address).then(() => {
      email.classList.add('copied');
      clearTimeout(email._copiedTimer);
      email._copiedTimer = setTimeout(() => email.classList.remove('copied'), 1400);
    });
  });
</script>
