<!-- People, /team-daim. Paste into the page's Code editor, Body tab. Two card
     behaviors that need script. Email renders as plain text with no anchor, so
     a click copies the address and holds `.copied` for a moment, which
     css/team-daim.css paints as a check mark. Joined renders as YYYY/MM/DD and
     Notion has no year-month format to pick (the Projects trap, see
     js/projects-date-format.js), so the day is cut here; the observer re-runs
     it because Super swaps .notion-root on client-side navigation. -->
<script>
  document.addEventListener('click', (e) => {
    const email = e.target.closest('.page__team-daim .notion-property__email');
    if (!email) return;
    const address = email.textContent.trim();
    if (!address) return;
    navigator.clipboard.writeText(address).then(() => {
      email.classList.add('copied');
      clearTimeout(email._copiedTimer);
      email._copiedTimer = setTimeout(() => email.classList.remove('copied'), 1400);
    });
  });

  (() => {
    const run = () =>
      document.querySelectorAll('.page__team-daim .notion-property__date .date')
        .forEach((el) => {
          const next = el.textContent.replace(/(\d{4}\/\d{2})\/\d{2}/, '$1');
          if (next !== el.textContent) el.textContent = next;
        });

    run();
    new MutationObserver(run).observe(document.body, { childList: true, subtree: true });
  })();
</script>
