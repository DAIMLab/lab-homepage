<!-- Home hero video. Home page's per-page Code editor, Body tab.
     Pairs with super:{{ autoplay }} in the video block's caption in Notion.

     Measured on the live site: that caption makes Super emit
       <video width="624px" controls="" autoPlay="">
     and nothing else. No browser honours autoplay without muted, so the clip
     never starts; loop and controls are not covered either. This supplies the
     three missing pieces and re-triggers playback, since setting muted after
     the browser has already refused does not retry on its own. -->
<script>
(function () {
  /* Keep in step with the selector used in css/home-hero.css. */
  var HERO = '.notion-root > .notion-callout.bg-gray-light';

  function fix(video) {
    if (video.dataset.daimHero) return;
    video.dataset.daimHero = '1';
    video.muted = true;
    video.loop = true;
    video.controls = false;
    video.removeAttribute('controls');
    video.setAttribute('playsinline', '');
    var played = video.play();
    /* Some browser settings refuse regardless; the first frame stays. */
    if (played && played.catch) played.catch(function () {});
  }

  function scan() {
    document.querySelectorAll(HERO + ' video').forEach(fix);
  }

  scan();
  /* Super navigates client-side, so the hero can mount after first paint. */
  new MutationObserver(scan).observe(document.documentElement, {
    childList: true,
    subtree: true
  });
})();
</script>
