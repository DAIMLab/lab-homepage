<!-- Home page hero autoplay. Paste into the Home page's per-page Code editor, Body tab.
     Notion renders a video block as <video width="400px" controls> with no autoplay
     attribute, and neither Notion nor CSS can add one. This flips those properties.
     Styles live in css/home-hero.css. -->
<script>
(function () {
  /* Keep in step with the selector used in css/home-hero.css. */
  var HERO = '.page__index .notion-root > .notion-callout.bg-gray-light';

  function start(video) {
    if (video.dataset.daimHero) return;
    video.dataset.daimHero = '1';
    video.muted = true;
    video.defaultMuted = true;
    video.loop = true;
    video.autoplay = true;
    video.controls = false;
    video.removeAttribute('controls');
    video.removeAttribute('width');
    video.setAttribute('playsinline', '');
    var played = video.play();
    /* Some browser settings reject autoplay outright; the first frame stays. */
    if (played && played.catch) played.catch(function () {});
  }

  function scan() {
    document.querySelectorAll(HERO + ' video').forEach(start);
  }

  scan();
  document.addEventListener('DOMContentLoaded', scan);
  /* Super navigates client-side, so the hero can mount after first paint. */
  new MutationObserver(scan).observe(document.documentElement, {
    childList: true,
    subtree: true
  });
})();
</script>
