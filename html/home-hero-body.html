<!-- Home hero, loop + controls fallback. Home page's per-page Code editor, Body tab.

     TRY DELETING THIS FIRST. Super has a native autoplay snippet: put
       super:{{ autoplay }}
     at the end of the video block's caption in Notion, per
     https://docs.super.so/additional-features. Autoplay only works muted, so
     that one caption may cover everything this file does.

     Paste this back only if, with the caption in place, the video still stops
     after one pass or still shows player controls. Neither loop nor controls
     is documented as part of the native snippet. -->
<script>
(function () {
  /* Keep in step with the selector used in css/home-hero.css. */
  var HERO = '.notion-root > .notion-callout.bg-gray-light';

  function fix(video) {
    if (video.dataset.daimHero) return;
    video.dataset.daimHero = '1';
    video.loop = true;
    video.controls = false;
    video.removeAttribute('controls');
  }

  function scan() {
    document.querySelectorAll(HERO + ' video').forEach(fix);
  }

  scan();
  /* Super navigates client-side, so the hero can mount after first paint. */
  new MutationObserver(scan).observe(document.documentElement, {
    childList: true,
    subtree: true
  });
})();
</script>
