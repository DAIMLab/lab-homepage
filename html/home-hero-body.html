<!-- Home hero video. Home page's per-page Code editor, Body tab.

     Measured on the live site: Notion emits <video controls>, and Super adds
     only autoPlay. No browser honours autoplay without muted, so the clip never
     starts on its own; loop and controls are not covered either.

     Playback is re-asserted rather than kicked off once. Super is a React app:
     hydration re-renders the <video>, which reloads the source and aborts any
     play() already in flight. Retrying on canplay and on every mutation tick
     survives that; the paused check keeps it from fighting a real pause. -->
<script>
(function () {
  /* Keep in step with the selector used in css/home-hero.css. */
  var HERO = '.notion-root > .notion-callout.bg-gray-light';

  function play(video) {
    if (!video.paused) return;
    var started = video.play();
    if (started && started.catch) {
      started.catch(function (err) {
        /* Silence here once cost an afternoon: the console looked clean while
           playback was being refused. Warn, but only once per element. */
        if (video.dataset.daimWarned) return;
        video.dataset.daimWarned = '1';
        console.warn('[daim] hero video did not start:', err.name, err.message);
      });
    }
  }

  function fix(video) {
    video.muted = true;
    video.loop = true;
    video.playsInline = true;
    if (video.controls) {
      video.controls = false;
      video.removeAttribute('controls');
    }
    if (!video.dataset.daimHero) {
      video.dataset.daimHero = '1';
      video.preload = 'auto';
      video.addEventListener('canplay', function () { play(video); });
      video.addEventListener('loadeddata', function () { play(video); });
    }
    play(video);
  }

  function scan() {
    document.querySelectorAll(HERO + ' video').forEach(fix);
  }

  scan();
  new MutationObserver(scan).observe(document.documentElement, {
    childList: true,
    subtree: true
  });
})();
</script>
